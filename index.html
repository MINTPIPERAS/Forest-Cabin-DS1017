<!DOCTYPE html>

  <link rel="preconnect" href="https://fonts.googleapis.com" />

</head>
<body>
  <main id="scene-root" aria-label="森林中的木屋 3D 场景">

    <div class="atmosphere" aria-hidden="true">

      <div class="top-scrim"></div>

            <path d="M24 29c-6.5 0-11-4.1-11-10.2 6.4 0 11 4 11 10.2Z" stroke="currentColor" stroke-width="1.1"/>
            <path d="M24 23.5c6.3 0 10.8-4 10.8-9.9-6.2 0-10.8 3.9-10.8 9.9Z" stroke="currentColor" stroke-width="1.1"/>
            <path d="M18 40h12" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand-copy">
          <span class="brand-name">Mistwood</span>
          <span class="brand-sub" data-copy="brandSub">湖畔灯舍 · Nº 09</span>
        </span>
      </a>
      <div class="status" aria-label="场景天气与时间">
        <span class="status-line">
          <span class="status-dot"></span>
          <span id="status-time">18:42</span>
          <span class="status-divider"></span>
          <span>AUTUMN 2026</span>
        </span>
        <span class="status-weather" id="status-weather">薄雾 · 西南风 2 级 · 7°C</span>
      </div>
    </header>

    <section class="intro-copy hud" aria-label="场景信息">
      <p class="eyebrow"><span></span> <span data-copy="eyebrow">A quieter kind of evening</span></p>
      <h1><span data-copy="heroTitleMain">林深</span><span class="accent" data-copy="heroTitleAccent">见灯</span></h1>
      <p class="tagline" id="scene-tagline">暮色漫过松针，木屋里煨着一盏黄昏。</p>
      <div class="interaction-note">
        <span class="note-line"></span>
        <span data-copy="hintOrbit">拖动环视</span>
        <i></i>
        <span data-copy="hintZoom">滚轮靠近</span>
      </div>
    </section>

    <div class="chapter hud" aria-hidden="true">
      <span>01</span>
      <span class="chapter-line"></span>
      <span>THE CABIN</span>
    </div>

    <nav class="controls hud" aria-label="场景控制">
      <button id="sound-toggle" class="control-button" type="button" aria-label="开启环境声" data-tooltip="环境声 · 关" aria-pressed="false">

        </svg>
        <svg class="icon icon-sound-on" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4.5 9.5v5h3.2l4.3 3.4V6.1L7.7 9.5H4.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>

        </svg>
        <span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </button>

      <button id="immersive-toggle" class="control-button" type="button" aria-label="进入沉浸模式" data-tooltip="沉浸看景 · H" aria-pressed="false">
        <svg class="icon icon-immersive" viewBox="0 0 24 24" fill="none" aria-hidden="true">

        </svg>

      <button id="fullscreen-toggle" class="control-button" type="button" aria-label="进入全屏" data-tooltip="全屏">

    <section class="scene-switcher hud" aria-label="场景设置">

        <span class="switcher-label">光线</span>
        <div class="segmented">

              <circle cx="12" cy="12" r="3.6" stroke="currentColor" stroke-width="1.3"/>

            </svg>
            <span>白天</span>
          </button>
          <button type="button" data-time="dusk" aria-pressed="true" class="segment is-active">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 16.5h16M6.6 16.5a5.4 5.4 0 0 1 10.8 0" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>

            </svg>
            <span>黄昏</span>
          </button>
          <button type="button" data-time="night" aria-pressed="false" class="segment">

      <span class="switcher-rule" aria-hidden="true"></span>

      <div class="switcher-group" role="group" aria-label="天气">
        <span class="switcher-label">天气</span>
        <div class="segmented">
          <button type="button" data-weather="clear" aria-pressed="true" class="segment is-active">

              <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.3"/>

            </svg>
            <span>晴</span>
          </button>
          <button type="button" data-weather="rain" aria-pressed="false" class="segment">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M7 14.5a3.6 3.6 0 0 1 .3-7.2 4.9 4.9 0 0 1 9.3 1.4 3 3 0 0 1-.4 5.8H7Z" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/>
              <path d="m9 17.4-1 2.6M13 17.4l-1 2.6M17 17.4l-1 2.6" stroke="currentColor" stroke-width="1.15" stroke-linecap="round"/>
            </svg>
            <span>雨</span>
          </button>
          <button type="button" data-weather="snow" aria-pressed="false" class="segment">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 3.5v17M4.6 7.8l14.8 8.4M19.4 7.8 4.6 16.2" stroke="currentColor" stroke-width="1.15" stroke-linecap="round"/>
              <path d="m9.4 5.4 2.6 1.7 2.6-1.7M9.4 18.6l2.6-1.7 2.6 1.7" stroke="currentColor" stroke-width="1.05" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>

    </section>

    <div class="location hud" aria-hidden="true">
      <span>48° 12′ N</span>
      <span class="location-sep"></span>
      <span>121° 47′ E</span>
    </div>

    <div class="immersive-hint" aria-hidden="true">
      <span class="immersive-key">H</span>
      <span data-copy="immersiveHint">退出沉浸模式</span>
    </div>
  </main>

  <div id="loader" aria-live="polite">

          <path d="M32 30.5c8.3 0 14.3-5.3 14.3-13.1-8.2 0-14.3 5.2-14.3 13.1Z" stroke="currentColor" stroke-width="1.2"/>
        </svg>
      </div>
      <p class="loader-kicker" data-copy="loaderKicker">MISTWOOD · Nº 09</p>
      <p class="loader-title" data-copy="loaderTitle">林深见灯</p>
      <div class="loader-progress"><span></span></div>
      <p class="loader-status" data-copy="loaderStatus">正在穿过雾林，点亮灯火…</p>
    </div>
    <p class="loader-foot" data-copy="loaderFoot">A FILM-LIKE FOREST STUDY · BEST WITH SOUND</p>
  </div>

  <noscript>
    <div class="no-script">这个场景需要启用 JavaScript 才能渲染。</div>
  </noscript>

  <script>
    (function () {
      function report(message, stack) {
        try {
          sessionStorage.setItem('mistwood-error', message + '\n' + (stack || ''));
        } catch (e) {}
        const status = document.querySelector('.loader-status');
        if (status) {
          status.textContent = '场景载入出错：' + message;
          status.style.color = 'rgba(231, 197, 155, 0.85)';
        }
      }
      window.addEventListener('error', (event) => {
        report(event.message || '未知错误', event.error && event.error.stack);
        console.error('[mistwood]', event.error || event.message);
      });
      window.addEventListener('unhandledrejection', (event) => {
        report(String(event.reason && event.reason.message || event.reason), event.reason && event.reason.stack);
      });
      window.__mistwoodReport = report;
      // Surface merge warnings from the world builder in the page for debugging.
      window.__mistwoodLogs = [];
      const origWarn = console.warn.bind(console);
      const origError = console.error.bind(console);
      console.warn = (...args) => {
        window.__mistwoodLogs.push('warn: ' + args.map(String).join(' '));
        origWarn(...args);
      };
      console.error = (...args) => {
        window.__mistwoodLogs.push('error: ' + args.map(String).join(' '));
        origError(...args);
      };
    })();
  </script>
  <script type="importmap">
    {
      "imports": {

        "three/addons/": "./vendor/three/addons/"

  </script>
  <script type="module" src="./src/main.js?v=3" onerror="window.__mistwoodReport && window.__mistwoodReport('模块加载失败: ' + this.src)"></script>
</body>
